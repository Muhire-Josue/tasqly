name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  push:
    branches:
      - "**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  compile:
    name: Compile Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile backend
        run: ./mvnw clean compile

  test:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: compile

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tasqly
          POSTGRES_USER: tasqly_admin
          POSTGRES_PASSWORD: tasqly_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        run: ./mvnw test

  package-docker-image:
    name: Package Backend Docker Image
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t tasqly-backend:ci \
            .