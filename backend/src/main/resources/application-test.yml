spring:
  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

tasqly:
  security:
    jwt:
      secret: "test-secret"
      issuer: tasqly-test
      expiration-minutes: 60