spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tasqly_test
    username: tasqly_admin
    password: tasqly_password
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migrations

  tasqly:
    security:
      jwt:
        secret: "test-secret"
        issuer: tasqly-test
        expiration-minutes: 1200
